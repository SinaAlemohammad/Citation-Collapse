[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-collapse"
version = "0.1.0"
description = "Recursive citation-concentration benchmark for LLMs, with a paraphrase memorization control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "faker>=24",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# metrics scripts that use SciPy / pandas / scikit-learn
metrics = ["scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3"]

[project.scripts]
cc-run          = "citation_collapse.core.run_nodes:main"
cc-batch-node0  = "citation_collapse.generate.batch_node0:main"
cc-random       = "citation_collapse.generate.generate_random:main"
cc-extract      = "citation_collapse.analysis.extract_selections:main"
cc-paraphrase   = "citation_collapse.paraphrase.paraphrase_seed:main"
cc-analyze      = "citation_collapse.analysis.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]
